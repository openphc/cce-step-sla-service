plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'org.sonarqube' version '6.3.1.5724'
}

group = 'org.openphc.cce'
version = '2.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Shared entities and repositories, and the deviation and history writers the applier uses.
    implementation 'org.openphc.cce:cce-common-util'

    // Spring Boot starters.
    // starter-web serves actuator's /actuator/health (container HEALTHCHECK and Kubernetes probes) and
    // /actuator/prometheus. There is no application API.
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Database. No Flyway: this service owns no tables and runs with flyway.enabled=false, so a
    // migration dependency here would only invite it to start writing DDL it does not own.
    runtimeOnly 'org.postgresql:postgresql'

    // No FHIR or JSONLogic declarations. This service parses no PlanDefinitions and evaluates no
    // expressions. cce-common-util still brings hapi-fhir, johnzon, jakarta.json,
    // hapi-fhir-caching-caffeine and org.fhir:ucum with it, and its FHIR beans still start; redeclaring
    // them here would only be a second version to keep in step.

    // Kafka admin client only, for the Matcher lag gate's two metadata reads. cce-common-util already brings
    // it through spring-kafka; declared because this service now calls it directly. The version is Spring
    // Boot's. Kafka auto-configuration stays excluded — see StepSlaServiceApplication.
    implementation 'org.apache.kafka:kafka-clients'

    // Observability
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Lets ApplicationContextTest start the whole context without a live PostgreSQL.
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Enforced at 98%: the only uncovered code is the application's main() bootstrap, which is excluded
// below. Raise nothing here without adding the tests first — the ratchet is the point.
jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            // Spring Boot's entry point: covering it means starting the whole context, which the
            // integration suite does far better than a unit test asserting main() ran.
            excludes = ['org.openphc.cce.sla.StepSlaServiceApplication']
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.98
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

sonar {
    properties {
        property 'sonar.organization', 'openphc'
        property 'sonar.projectKey', 'openphc_cce-step-sla-service'
        // The report jacocoTestReport already emits. Sonar reads coverage from this file rather
        // than measuring anything itself, so the two can only agree.
        property 'sonar.coverage.jacoco.xmlReportPaths',
                 "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
    }
}

// Without this, `gradlew sonar` on a clean checkout uploads with no coverage at all — the task does
// not build the report it reads.
tasks.named('sonar') {
    dependsOn jacocoTestReport
}
