# ==============================================================================
# CCE Step SLA Service — Application Configuration
# ==============================================================================

server:
  port: ${SERVER_PORT:8092}

spring:
  application:
    name: cce-step-sla-service

  # --- DataSource ---
  # Shared ccedb. DB_PORT defaults to the standard 5432; set it to 5433 to reach the instance
  # deployed by cce-collector-service.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ccedb}
    username: ${DB_USERNAME:cce_user}
    password: ${DB_PASSWORD:cce_pass}
    # One scheduler thread does all the work, one batch at a time (backOff runs after the failed batch
    # has released its connection), so steady state is a single connection. The other two cover what
    # can overlap a batch: a Prometheus scrape running the due-transitions gauge query, and the actuator
    # health check. Raise this only if the service gains another concurrent database user.
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Sends a batch's writes (transition and step UPDATEs, history and deviation INSERTs) as JDBC
        # batches rather than one round trip each. Same values as the Matcher Service. History ids come
        # from a sequence in blocks of 50 and deviations are recorded once per batch, which is what keeps
        # the inserts batchable — see docs/architecture-overview.md §7.
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true

  # --- Flyway ---
  # This service owns no tables. The Matcher Service's migration creates step_instance,
  # step_sla_state_transition, deviation and intelligence_event_log; the Protocol Service's creates
  # protocol_definition, action_definition and trigger_index. Enabling Flyway here would
  # only add an empty ledger and invite a second service to start writing DDL for tables it does not own.
  flyway:
    enabled: false

# --- SLA sweep ---
cce:
  sla:
    # The evaluator fetches step_sla_state_transition rows with FOR UPDATE SKIP LOCKED, so every replica
    # can poll concurrently. This interval is the steady-state cost — one empty fetch query per tick; a
    # backlog is drained within a single cycle rather than one batch per tick. 5s suits development;
    # the prod profile (application-prod.yml) raises it to 15s.
    poll-interval-ms: ${CCE_SLA_POLL_INTERVAL_MS:5000}
    # The fetch locks every step tied to a row in the batch for the whole transaction (see
    # SlaTransitionFetchRepository), so a larger batch holds step_instance locks longer and blocks
    # Matcher's writes to those steps for longer. SlaTransitionApplier.MAX_BATCH_SIZE (100) refuses to
    # start above that — see its Javadoc for the measurements. Do not raise this past 100 without
    # re-measuring on production-scale hardware.
    batch-size: ${CCE_SLA_BATCH_SIZE:100}
    # Recorded in processed_by, so each row says which replica applied it.
    instance-id: ${CCE_SLA_INSTANCE_ID:${HOSTNAME:local}}
    # Cap on the exponential retry backoff for a row that keeps failing.
    max-backoff-seconds: ${CCE_SLA_MAX_BACKOFF_SECONDS:3600}

    # Holds SLA evaluation while the Matcher Service is behind on its topic — the in-process form of the
    # Event Replay prerequisite (docs/architecture-overview.md). Lag is the total across all partitions:
    # read-committed end offset minus the group's committed offset. Fail-closed: a lag that cannot be read
    # pauses evaluation too, and every pause lasts until the lag is at or below resume-at-or-below.
    matcher-lag-gate:
      enabled: ${CCE_SLA_MATCHER_LAG_GATE_ENABLED:true}
      # Holds every cycle whatever the lag. Set it for a planned Event Replay: a replay published slowly
      # enough for the Matcher Service to keep up never builds lag, so the gate alone would not catch it.
      force-pause: ${CCE_SLA_MATCHER_LAG_GATE_FORCE_PAUSE:false}
      # Same variable as the Matcher Service, so both point at the same cluster.
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      group-id: ${CCE_SLA_MATCHER_LAG_GATE_GROUP_ID:cce-matcher-service}
      topic: ${CCE_SLA_MATCHER_LAG_GATE_TOPIC:cce.events.inbound}
      # Well above the handful of events normally in flight, far below the thousands a bulk load or replay
      # puts on the topic at once.
      pause-above: ${CCE_SLA_MATCHER_LAG_GATE_PAUSE_ABOVE:100}
      # Lower than pause-above so a draining backlog's last events are matched before evaluation resumes.
      resume-at-or-below: ${CCE_SLA_MATCHER_LAG_GATE_RESUME_AT_OR_BELOW:5}
      # Budget for one whole check. Past it the check counts as failed — the single scheduler thread must
      # not wait on the Kafka admin client's 60s default.
      check-timeout: ${CCE_SLA_MATCHER_LAG_GATE_CHECK_TIMEOUT:5s}
      # Passed to the Kafka admin client as-is, e.g. security.protocol for a secured cluster.
      additional-kafka-admin-client-properties: {}

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: cce-step-sla-service

# --- Logging ---
logging:
  level:
    root: INFO
    org.hibernate: WARN
    org.openphc.cce.sla: INFO

